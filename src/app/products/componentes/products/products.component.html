<div class="products-page">
    <div class="products-header">
        <div class="header-content">
            <div class="header-badge">
                <mat-icon>shopping_bag</mat-icon>
                <span>Catálogo</span>
            </div>
            <h1 class="page-title">Todos los Productos</h1>
            <p class="page-subtitle">Explora nuestra colección completa de productos premium seleccionados especialmente para ti</p>
        </div>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <button mat-stroked-button class="filter-btn active">
                    <mat-icon>apps</mat-icon>
                    Todos
                </button>
                <button mat-stroked-button class="filter-btn">
                    <mat-icon>fiber_new</mat-icon>
                    Nuevos
                </button>
                <button mat-stroked-button class="filter-btn">
                    <mat-icon>local_offer</mat-icon>
                    Ofertas
                </button>
                <button mat-stroked-button class="filter-btn">
                    <mat-icon>trending_up</mat-icon>
                    Populares
                </button>
            </div>
            
            <div class="view-options">
                <span class="results-count">{{ products.length }} productos</span>
                <button mat-icon-button [matMenuTriggerFor]="sortMenu">
                    <mat-icon>sort</mat-icon>
                </button>
                <mat-menu #sortMenu="matMenu">
                    <button mat-menu-item>
                        <mat-icon>arrow_upward</mat-icon>
                        Precio: Menor a Mayor
                    </button>
                    <button mat-menu-item>
                        <mat-icon>arrow_downward</mat-icon>
                        Precio: Mayor a Menor
                    </button>
                    <button mat-menu-item>
                        <mat-icon>star</mat-icon>
                        Mejor Calificados
                    </button>
                </mat-menu>
            </div>
        </div>
    </div>

    <div class="product-grid">
        <app-product
            *ngFor="let p of products"
            (productClicked)="clickProduct($event)" 
            [products]="p" 
        ></app-product>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="products.length === 0">
        <div class="empty-icon">
            <mat-icon>inventory_2</mat-icon>
        </div>
        <h3>No hay productos disponibles</h3>
        <p>Vuelve pronto para ver nuevos productos</p>
    </div>
</div>
